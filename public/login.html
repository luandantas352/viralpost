<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPost — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0B0B0F;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .auth-card .logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .auth-card .logo svg { width: 24px; height: 24px; fill: #fff; }
        .auth-card h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
        .auth-card .subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 2rem; }
        .field { margin-bottom: 1rem; text-align: left; }
        .field label { display: block; font-size: 0.78rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.4rem; }
        .field input {
            width: 100%; padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; color: #f1f5f9;
            font-size: 0.9rem; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #8b5cf6; }
        .btn-auth {
            display: block; width: 100%; padding: 0.9rem; margin-top: 1.5rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff; font-size: 0.95rem; font-weight: 700;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 30px rgba(139,92,246,0.25);
            transition: transform 0.2s;
        }
        .btn-auth:hover { transform: translateY(-2px); }
        .auth-link { margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
        .auth-link a { color: #8b5cf6; text-decoration: none; }
        .error-msg { color: #f87171; font-size: 0.82rem; margin-top: 0.75rem; display: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <h1>Entrar no ViralPost</h1>
        <p class="subtitle">Acesse sua conta para criar carrosséis virais.</p>
        <form onsubmit="login(event)">
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="Sua senha" required>
            </div>
            <p class="error-msg" id="errorMsg">E-mail ou senha incorretos.</p>
            <button type="submit" class="btn-auth">Entrar</button>
        </form>
        <p class="auth-link">Não tem conta? <a href="/#planos">Assinar agora</a></p>
    </div>
    <script>
        function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.querySelector('.btn-auth');
            btn.textContent = 'Entrando...';
            btn.disabled = true;

            setTimeout(() => {
                const user = JSON.parse(localStorage.getItem('viralpost_user') || 'null');
                if (user && user.email === email) {
                    window.location.href = '/gerador.html';
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    btn.textContent = 'Entrar';
                    btn.disabled = false;
                }
            }, 1000);
        }
    </script>
</body>
</html>
