<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralPost — Checkout Seguro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0B0B0F;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .checkout-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 440px;
            width: 100%;
        }
        .checkout-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .checkout-card .plan-info {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .checkout-card .plan-info strong {
            color: #f1f5f9;
            font-size: 1.8rem;
            display: block;
            margin-top: 0.5rem;
        }
        .field { margin-bottom: 1.2rem; }
        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }
        .field input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus { border-color: #8b5cf6; }
        .row { display: flex; gap: 1rem; }
        .row .field { flex: 1; }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(139,92,246,0.25);
            transition: transform 0.2s;
        }
        .btn-pay:hover { transform: translateY(-2px); }
        .secure-note {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #64748b;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #8b5cf6;
            font-size: 0.85rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="checkout-card">
        <h1>Checkout Seguro</h1>
        <div class="plan-info">
            <span id="planName">Plano Anual</span>
            <strong id="planPrice">R$ 297,90/ano</strong>
        </div>
        <form id="checkoutForm" onsubmit="processPayment(event)">
            <div class="field">
                <label>Nome completo</label>
                <input type="text" id="name" placeholder="Seu nome" required>
            </div>
            <div class="field">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="field">
                <label>Número do cartão</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>
            <div class="row">
                <div class="field">
                    <label>Validade</label>
                    <input type="text" id="expiry" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="field">
                    <label>CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                </div>
            </div>
            <button type="submit" class="btn-pay">Finalizar Pagamento</button>
        </form>
        <p class="secure-note">Pagamento protegido com criptografia SSL 256-bit</p>
        <a href="/" class="back-link">&larr; Voltar para o site</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const plan = params.get('plan') || 'anual';
        if (plan === 'mensal') {
            document.getElementById('planName').textContent = 'Plano Mensal';
            document.getElementById('planPrice').textContent = 'R$ 97,00/mês';
        }

        function processPayment(e) {
            e.preventDefault();
            const btn = document.querySelector('.btn-pay');
            btn.textContent = 'Processando...';
            btn.disabled = true;
            setTimeout(() => {
                window.location.href = '/register.html?email=' + encodeURIComponent(document.getElementById('email').value);
            }, 2000);
        }
    </script>
</body>
</html>
